services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enlace_dev
      POSTGRES_USER: enlace_dev
      POSTGRES_PASSWORD: enlace_dev_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - enlace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enlace_dev -d enlace_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  enlace_postgres_data:
