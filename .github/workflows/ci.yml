name: Verificações

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enlace_test
          POSTGRES_PASSWORD: enlace_test_local
          POSTGRES_DB: enlace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enlace_test -d enlace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://enlace_test:enlace_test_local@127.0.0.1:5432/enlace_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm run build:api
      - run: pnpm run build:vercel
      - run: pnpm measure:web
